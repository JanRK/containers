name: build

# Build / mirror pipeline (decisions 3, 4, 9, 11). GitHub executes the resolved
# plan in desired/<name>.json verbatim — it performs no substitution. Triggers
# deliberately exclude state/** and history/** so the record job's commit does
# not re-trigger a build (no [skip ci] needed).
#
# A step is an action, or one script invocation with literal arguments: no
# pipelines, no case, no jq, no yq (spec 9.6). Logic lives in scripts/, where it
# has a bats file; step-level if: is the one carve-out. Values reach a script
# through env, never ${{ }} pasted into the shell, so a quote in a plan value
# cannot end an argument.
on:
  push:
    branches: [main]
    paths:
      - 'jobs/**'
      - 'desired/**'
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to build (empty = all enabled jobs)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # detect — diff-scoped matrix selection (decision 11).
  # ---------------------------------------------------------------------------
  detect:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.detect.outputs.jobs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # yq comes from the runner image. Its one reader on this plane is the
      # .enabled read in detect-jobs.sh: matrix selection is not execution, and
      # must see jobs that have no marker (spec 9.7). No other job names it.
      - name: Detect jobs to build
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_JOB: ${{ github.event.inputs.job }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: >-
          bash scripts/detect-jobs.sh --event "$EVENT" --repo-root .
          --dispatch-job "$DISPATCH_JOB" --before "$BEFORE" --sha "$SHA"
          >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # build — one matrix leg per job; commits nothing, uploads a result artifact
  # (decisions 4, 9). Per-job concurrency queues (never cancels) overlapping
  # builds of the same job (decision 3).
  # ---------------------------------------------------------------------------
  build:
    needs: detect
    if: needs.detect.outputs.jobs != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.detect.outputs.jobs) }}
    concurrency:
      group: build-${{ matrix.job }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The plan loads once, here; every later step reads these outputs (spec
      # 9.4). The config gate alone re-reads the marker, through read-plan.sh,
      # for configDigest. A missing marker means the check requested no build
      # (decision 3), while detect can still select the job from a jobs/<id>/**
      # change, so it is a clean skip: every later step chains off this one.
      - name: Read the plan
        id: cfg
        if: hashFiles(format('desired/{0}.json', matrix.job)) != ''
        env:
          MARKER: desired/${{ matrix.job }}.json
        run: bash scripts/read-plan.sh --marker "$MARKER" >> "$GITHUB_OUTPUT"

      # Before the registry guard: a plan resolved from a job.yaml that has since
      # changed leaves nothing to ask the registry about. A mismatch is a green
      # skip, and self-heals on the next tick (spec 9.1).
      - name: Config gate
        id: config
        if: steps.cfg.outcome == 'success'
        env:
          MARKER: desired/${{ matrix.job }}.json
          JOB_YAML: jobs/${{ matrix.job }}/job.yaml
        run: >-
          bash scripts/compare-config-digest.sh --marker "$MARKER" --job-yaml "$JOB_YAML"
          >> "$GITHUB_OUTPUT"

      - name: Registry-skip guard
        id: guard
        if: steps.config.outputs.config == 'match'
        env:
          IMAGE: ${{ steps.cfg.outputs.image }}
          TARGET_TAG: ${{ steps.cfg.outputs.targetTag }}
          TRACK: ${{ steps.cfg.outputs.track }}
          DIGEST: ${{ steps.cfg.outputs.digest }}
        run: >-
          bash scripts/should-build.sh --image "$IMAGE" --target-tag "$TARGET_TAG"
          --track "$TRACK" --digest "$DIGEST"
          >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.guard.outputs.decision == 'build'
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        if: steps.guard.outputs.decision == 'build'
        uses: docker/setup-buildx-action@v4

      # One step per mode, each with a literal argument list, so the run UI shows
      # which of three failure modes happened (spec 9.6).
      - name: Mirror
        if: steps.guard.outputs.decision == 'build' && steps.cfg.outputs.mode == 'mirror'
        env:
          SOURCE: ${{ steps.cfg.outputs.mirrorSource }}
          IMAGE: ${{ steps.cfg.outputs.image }}
          TARGET_TAG: ${{ steps.cfg.outputs.targetTag }}
          EXTRA_TAGS: ${{ steps.cfg.outputs.extraTags }}
          NAME: ${{ steps.cfg.outputs.name }}
          RESOLVED: ${{ steps.cfg.outputs.resolved }}
          RESULT: ${{ runner.temp }}/${{ matrix.job }}.json
        run: >-
          bash scripts/mirror.sh --source "$SOURCE" --image "$IMAGE"
          --target-tag "$TARGET_TAG" --extra-tags "$EXTRA_TAGS"
          --name "$NAME" --resolved "$RESOLVED" --result "$RESULT"

      - name: Build (local Dockerfile)
        if: steps.guard.outputs.decision == 'build' && steps.cfg.outputs.mode == 'local-dockerfile'
        env:
          IMAGE: ${{ steps.cfg.outputs.image }}
          TARGET_TAG: ${{ steps.cfg.outputs.targetTag }}
          EXTRA_TAGS: ${{ steps.cfg.outputs.extraTags }}
          BUILD_ARGS: ${{ steps.cfg.outputs.buildArgs }}
          PLATFORMS: ${{ steps.cfg.outputs.platforms }}
          DOCKERFILE: ${{ steps.cfg.outputs.dockerfile }}
          CONTEXT: ${{ steps.cfg.outputs.context }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          NAME: ${{ steps.cfg.outputs.name }}
          RESOLVED: ${{ steps.cfg.outputs.resolved }}
          RESULT: ${{ runner.temp }}/${{ matrix.job }}.json
        run: >-
          bash scripts/build.sh --image "$IMAGE" --target-tag "$TARGET_TAG"
          --extra-tags "$EXTRA_TAGS" --build-args "$BUILD_ARGS" --platforms "$PLATFORMS"
          --dockerfile "$DOCKERFILE" --context "$CONTEXT"
          --push true --source "$REPO_URL"
          --name "$NAME" --resolved "$RESOLVED" --result "$RESULT"

      # Clones the public repo at the resolved ref; dockerfile and context are
      # relative to the clone root (decision 1, ADR-0009).
      - name: Build (remote Dockerfile)
        if: steps.guard.outputs.decision == 'build' && steps.cfg.outputs.mode == 'remote-dockerfile'
        env:
          IMAGE: ${{ steps.cfg.outputs.image }}
          TARGET_TAG: ${{ steps.cfg.outputs.targetTag }}
          EXTRA_TAGS: ${{ steps.cfg.outputs.extraTags }}
          BUILD_ARGS: ${{ steps.cfg.outputs.buildArgs }}
          PLATFORMS: ${{ steps.cfg.outputs.platforms }}
          DOCKERFILE: ${{ steps.cfg.outputs.dockerfile }}
          CONTEXT: ${{ steps.cfg.outputs.context }}
          REPO: ${{ steps.cfg.outputs.repo }}
          REF: ${{ steps.cfg.outputs.ref }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          NAME: ${{ steps.cfg.outputs.name }}
          RESOLVED: ${{ steps.cfg.outputs.resolved }}
          RESULT: ${{ runner.temp }}/${{ matrix.job }}.json
        run: >-
          bash scripts/build.sh --image "$IMAGE" --target-tag "$TARGET_TAG"
          --extra-tags "$EXTRA_TAGS" --build-args "$BUILD_ARGS" --platforms "$PLATFORMS"
          --dockerfile "$DOCKERFILE" --context "$CONTEXT" --repo "$REPO" --ref "$REF"
          --push true --source "$REPO_URL"
          --name "$NAME" --resolved "$RESOLVED" --result "$RESULT"

      - name: Smoke test (native arch)
        if: steps.guard.outputs.decision == 'build'
        env:
          REF: ${{ steps.cfg.outputs.image }}:${{ steps.cfg.outputs.targetTag }}
          TESTS: ${{ steps.cfg.outputs.test }}
        run: bash scripts/smoke-test.sh --image "$REF" --tests "$TESTS"

      - name: Upload result artifact
        if: steps.guard.outputs.decision == 'build'
        uses: actions/upload-artifact@v7
        with:
          name: result-${{ matrix.job }}
          path: ${{ runner.temp }}/${{ matrix.job }}.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # record — single fan-in writer of state/ and history/ (decision 4). Runs even
  # if some build legs failed, recording only the successful artifacts; failed
  # jobs self-heal on the next check cadence (decision 3).
  # ---------------------------------------------------------------------------
  record:
    needs: build
    if: ${{ always() && needs.build.result != 'skipped' && needs.build.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          path: _artifacts
          pattern: result-*
          merge-multiple: true

      - name: Record state and history
        if: hashFiles('_artifacts/*.json') != ''
        run: bash scripts/record.sh --artifacts _artifacts --state-dir state --history-dir history

      # Skips cleanly when nothing was recorded.
      - name: Commit and push
        run: >-
          bash scripts/commit-record.sh --repo-root .
          --name container-bot --email container-bot@users.noreply.github.com
          --message "record: update build state and history"
          --path state --path history
