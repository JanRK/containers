name: airlock-base
mode: local-dockerfile
registry: ghcr.io/janrk
platforms:
  - linux/amd64
tagFormat: "v{version}-aoe{aoe}-m{mise}-b{basestamp}"
extraTags: []
sources:
  - id: version
    method: literal
    value: "0.1.0"
  - id: aoe
    method: githubRelease
    link: agent-of-empires/agent-of-empires
    tagPrefixStrip: v
  - id: mise
    method: githubRelease
    link: jdx/mise
    tagPrefixStrip: v
  - id: base
    method: localJob
    link: pwsh-slim
  - id: basestamp
    method: localJob
    link: pwsh-slim
    tagPrefixStrip: v
buildArgs:
  BASE_TAG: "{base}"
  AOE_VERSION: "{aoe}"
  MISE_VERSION: "{mise}"
test:
  - entrypoint: aoe
    args: ["--version"]
  - entrypoint: mise
    args: ["--version"]
  - entrypoint: node
    args: ["--version"]
  - entrypoint: jq
    args: ["--version"]
  - entrypoint: sh
    args: ["-c", "missing=; for tool in dig fd file lsof make patch ps shellcheck tree xz; do command -v \"$tool\" >/dev/null 2>&1 || missing=\"$missing $tool\"; done; [ -z \"$missing\" ] || echo \"missing:$missing\" >&2; [ -z \"$missing\" ]"]
  - entrypoint: sh
    args: ["-c", "yq --version | grep -q mikefarah"]
  - entrypoint: pwsh
    args: ["-NoLogo", "-NoProfile", "-Command", "$PSVersionTable.PSVersion.ToString()"]
  - entrypoint: airlock-setup
    args: []
  - entrypoint: sh
    args: ["-c", "for tool in docker cloudflared tailscale; do command -v \"$tool\" >/dev/null 2>&1 && exit 1; done; exit 0"]
