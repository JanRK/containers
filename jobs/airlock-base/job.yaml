name: airlock-base
mode: local-dockerfile
registry: ghcr.io/janrk
platforms:
  - linux/amd64
tagFormat: "v{aoe}-m{mise}-b{basestamp}"
extraTags: []
sources:
  - id: aoe
    method: githubRelease
    link: agent-of-empires/agent-of-empires
    tagPrefixStrip: v
  - id: mise
    method: githubRelease
    link: jdx/mise
    tagPrefixStrip: v
  - id: base
    method: localJob
    link: pwsh-slim
  - id: basestamp
    method: localJob
    link: pwsh-slim
    tagPrefixStrip: v
buildArgs:
  BASE_TAG: "{base}"
  AOE_VERSION: "{aoe}"
  MISE_VERSION: "{mise}"
test:
  - entrypoint: aoe
    args: ["--version"]
  - entrypoint: mise
    args: ["--version"]
  - entrypoint: pwsh
    args: ["-NoLogo", "-NoProfile", "-Command", "$PSVersionTable.PSVersion.ToString()"]
  - entrypoint: airlock-setup
    args: []
  - entrypoint: sh
    args: ["-c", "for tool in docker cloudflared tailscale; do command -v \"$tool\" >/dev/null 2>&1 && exit 1; done; exit 0"]
